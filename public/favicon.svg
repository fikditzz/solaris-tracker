<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <!-- Sun -->
  <circle cx="50" cy="50" r="30" fill="url(#sun-grad)" />
  <!-- Rays -->
  <path d="M 50 5 L 50 15 M 50 85 L 50 95 M 5 50 L 15 50 M 85 50 L 95 50 M 18 18 L 25 25 M 75 75 L 82 82 M 18 82 L 25 75 M 75 18 L 82 25" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <!-- Solar Panel -->
  <g transform="translate(50, 60) rotate(-15) translate(-25, -15)">
    <rect width="50" height="30" rx="4" fill="url(#panel-grad)" stroke="#1E3A8A" stroke-width="2" />
    <line x1="12.5" y1="0" x2="12.5" y2="30" stroke="#60A5FA" stroke-width="1.5" />
    <line x1="25" y1="0" x2="25" y2="30" stroke="#60A5FA" stroke-width="1.5" />
    <line x1="37.5" y1="0" x2="37.5" y2="30" stroke="#60A5FA" stroke-width="1.5" />
    <line x1="0" y1="15" x2="50" y2="15" stroke="#60A5FA" stroke-width="1.5" />
  </g>
</svg>
