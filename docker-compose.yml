version: '3.8'

services:
  app:
    build: .
    container_name: solaris-app
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db

  db:
    image: mysql:8.0
    container_name: solaris-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: solaris_db
      MYSQL_ROOT_PASSWORD: password_rahasia_anda
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
